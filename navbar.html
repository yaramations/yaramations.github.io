<!DOCTYPE html>
<html>
<head>
 <style>
    @font-face{
        font-family: 'Starborn';
        src: url(/yaramations.github.io/fonts/starborn/Starborn.ttf);
        }
    @font-face{
        font-family: 'Papernotes';
        src: url(/yaramations.github.io/fonts/papernotes/Papernotes.otf)
        }
    @font-face{
        font-family: "SuperMagical";
        src: url(/yaramations.github.io/fonts/Super\ Magical.ttf)
        }

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: SuperMagical;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #ffffff00
    }
    nav {
        position: relative;
        width: 1080px;
        height: 50px;
        background:#8ffdff;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    nav a{
        position: relative;
        display: inline-block;
        font-family: "SuperMagical";
        font-size: 1em;
        font-weight: 1000;
        color: #68062c;
        text-decoration: none;
        padding: 0 23px;
        z-index: 1;
    }
    
    nav span {
        position: absolute;
        top: 0;
        left: 0;
        width: 95px;
        height: 100%;
        background: linear-gradient(45deg, #f21e8f, #cd80b7);
        border-radius: 8px;
        transition: 0.5s;
    }
    nav a:nth-child(1):hover~span{
        left: 0;
    }
    nav a:nth-child(2):hover~span{
        left:100px
    }
    nav a:nth-child(3):hover~span{
        left: 200px;
        width: 110px;
    }
    nav a:nth-child(4):hover~span{
        left: 300px;
        width: 110px;
    }
    nav a:nth-child(5)hover~span{
        left: 600px;
        width: 110px;
    }

</style>
</head>


<body>
<nav>
<img src="" alt="MY LOGO IN THE CORNER">

<a href="/yaramations.github.io/contact.html">Contact</a> 
<a href="/yaramations.github.io/aboutme.html">About Me</a>
<a href="#"> Portfolio </a>
<a href="#"> Thing 5</a>
<span></span>
</nav>

</body>
</html>
