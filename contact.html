<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial-scale = 1">
        <style>
            *{
                padding: 0;
                margin: 0;
                box-sizing: border-box;

            
            }
            body{

             background-color: linear-gradient(#B7E8DF, #64938B)
            }
            @font-face{
                font-family: 'Starborn';
                src: url(fonts/Starborn.ttf);
            }

            .contact{
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content:space-evenly;
            }
            .c-left{
                display:flex;
                flex-direction: column;
                align-items: start;
                gap: 20px;
            }

            #contactheader {
                font-size: large;
                font-weight: 700;
                margin-bottom: 5px;
            }
        </style>
    </head>

<body>

    <div class="contact">
        <h2 style="font-family: Starborn;" id="contactheader"> Contact Me!</h2>
        <form action="" class="c-left">
            <input type="text" name="name" placeholder="Name" class="c-input">
            <input type="email" name="email" placeholder="Email" class="c-input">
            <textarea name="message" placeholder="Your Message" class="c-input"></textarea>
            <button type="submit"> Submit <img src=""> </button>
        </form>

    </div>

</body>

</html>
